<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema Gestor de citas médicas - Login</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{ background:#f4f6f8; }
        .form{ display:none; }
        .active{ display:block; }
    </style>
</head>
<body>
<div class="card shadow p-4">
    <!-- LOGIN -->
    <div id="loginForm" class="form active">
        <h3 class="text-center mb-4">Iniciar Sesión</h3>
        <form action="/dashboard" method="post">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100"> Entrar </button>
        </form>
        <div class="text-center mt-3">
            <span class="text-primary" style="cursor:pointer;" onclick="mostrarRegistro()"> ¿No tienes cuenta? Registrarse </span>
        </div>
    </div>
    <!-- REGISTRO -->
    <div id="registroForm" class="form">
        <h3 class="text-center mb-4">Crear Cuenta</h3>
        <form action="/register" method="post">
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" name="nombre" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Rol</label>
                <select name="rol" class="form-select" required>
                    <option value="">Seleccione un rol</option>
                    <option value="USER">Usuario</option>
                    <option value="ADMIN">Administrador</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100"> Registrarse </button>
        </form>
        <div class="text-center mt-3">
            <span class="text-primary" style="cursor:pointer;" onclick="mostrarLogin()"> ¿Ya tienes cuenta? Iniciar sesión </span>
        </div>
    </div>
</div>
<script>
    <!-- Funcion_para_mostrar_el_html_de_Registro_y_ocultar_el_de_Login -->
    function mostrarRegistro(){
        document.getElementById("loginForm").classList.remove("active");
        document.getElementById("registroForm").classList.add("active");
    }
    <!-- Funcion para mostrar el html de Login y ocultar el de registro -->
    function mostrarLogin(){
        document.getElementById("registroForm").classList.remove("active");
        document.getElementById("loginForm").classList.add("active");
    }
</script>
</body>
</html>
