<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Crear Cita</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
  <!-- NAVBAR -->
  <div th:replace="fragments/menu :: menu"></div>
  <!-- PAGE-->
  <div class="container mt-5">
    <h2>Crear Cita</h2>
    <form th:action="@{/citas/guardar}" th:object="${cita}" method="post">
      <div class="mb-3">
        <label>Paciente</label>
        <input type="text" th:field="*{paciente}" class="form-control">
      </div>
      <div class="mb-3">
        <label>Fecha</label>
        <input type="date" th:field="*{fecha}" class="form-control">
      </div>
      <div class="mb-3">
        <label>Hora</label>
        <input type="time" th:field="*{hora}" class="form-control">
      </div>
      <div class="mb-3">
        <label>Doctor</label>
        <input type="text" th:field="*{doctor}" class="form-control">
      </div>
      <div class="mb-3">
        <label>Motivo</label>
        <input type="text" th:field="*{motivo}" class="form-control">
      </div>
      <button class="btn btn-primary">
        Guardar Cita
      </button>
    </form>
  </div>
</body>
</html>
