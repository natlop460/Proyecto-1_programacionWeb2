<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agenda del Día</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- NAVBAR -->
<div th:replace="~{fragments/menu :: menu}"></div>
<!-- PAGE -->
<div class="container mt-5">
    <h3 class="mb-4">
        Agenda del día:
        <span th:text="${fecha}"></span>
    </h3>
    <table class="table table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Hora</th>
            <th>Estado</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entry : ${agenda}">
            <!-- Hora -->
            <td th:text="${entry.key}"></td>
            <!-- Estado -->
            <td>
                <!-- Hora libre -->
                <span th:if="${entry.value == null}" class="badge bg-success">
                    Libre
                </span>
                <!-- Hora ocupada -->
                <span th:if="${entry.value != null}" class="badge bg-danger">
                    Ocupado
                </span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
